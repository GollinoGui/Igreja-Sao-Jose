<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Paróquia São José de Orlândia-SP — Diocese de Franca. Mais de 130 anos de história, horários de missa, sacramentos, notícias e contato."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Paróquia São José — Orlândia-SP" />
    <meta
      property="og:description"
      content="Mais de 130 anos de história, horários de missa, sacramentos, notícias e contato da Paróquia São José, em Orlândia-SP."
    />
    <meta property="og:locale" content="pt_BR" />
    <title>Paróquia São José — Orlândia-SP</title>
    <script>
      // Sem isso, o navegador restaura a posição de scroll de antes do
      // refresh — e como a seção da galeria (GallerySection.jsx) nasce com
      // altura 0 e só cresce por interação, um refresh no meio da página
      // reapareceria "no lugar errado", sem a galeria ter crescido ainda.
      // Precisa rodar antes do navegador restaurar o scroll, daí o inline
      // script síncrono no <head> em vez de um useEffect no React.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
